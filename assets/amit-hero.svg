
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Amit Kumar — Software Developer</title>
  <desc id="desc">Premium burgundy animated developer profile banner.</desc>

  <defs>
    <linearGradient id="amitWine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#190B12"/>
      <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="amitGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#701A3D"/>
      <animate attributeName="x2" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="amitGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#C77B9B" stroke-opacity=".12" stroke-width=".7"/>
    </pattern>

    <filter id="amitBlur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="18" fill="url(#amitWine)"/>
  <rect width="1200" height="360" rx="18" fill="url(#amitGrid)"/>

  <!-- Ambient glow -->
  <circle cx="1010" cy="120" r="110" fill="#701A3D" opacity=".17" filter="url(#amitBlur)"/>

  <!-- Orbital geometry -->
  <circle cx="1010" cy="120" r="100" fill="none" stroke="#C77B9B" stroke-opacity=".25"/>

  <circle cx="1010" cy="120" r="75" fill="none"
          stroke="#E5B5C7" stroke-opacity=".2" stroke-dasharray="4 9">
    <animateTransform attributeName="transform"
      type="rotate" from="0 1010 120" to="360 1010 120"
      dur="35s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1085" cy="120" r="5" fill="#E5B5C7">
    <animate attributeName="opacity" values=".3;1;.3"
             dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Top labels -->
  <g fill="#E5B5C7" font-family="monospace" font-size="11" opacity=".75">
    <text x="65" y="48">PORTFOLIO / 2026</text>
    <text x="1080" y="315" text-anchor="end">BUILD · LEARN · INNOVATE</text>
  </g>

  <!-- Main identity -->
  <text x="65" y="145"
        fill="#F8F0F3"
        font-family="Arial, Helvetica, sans-serif"
        font-size="67"
        font-weight="bold"
        letter-spacing="2">
    AMIT KUMAR
  </text>

  <text x="68" y="188"
        fill="#E5B5C7"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        letter-spacing="2">
    SOFTWARE DEVELOPER
  </text>

  <text x="68" y="220"
        fill="#C77B9B"
        font-family="Arial, Helvetica, sans-serif"
        font-size="15"
        letter-spacing="1.5">
    FULL-STACK DEVELOPMENT / AI &amp; MACHINE LEARNING
  </text>

  <!-- Animated underline -->
  <path d="M68 246 H500"
        stroke="#701A3D"
        stroke-width="3"
        stroke-linecap="round"/>

  <path d="M68 246 H500"
        stroke="url(#amitGlow)"
        stroke-width="3"
        stroke-linecap="round"
        stroke-dasharray="100 332">
    <animate attributeName="stroke-dashoffset"
             values="432;0"
             dur="4s"
             repeatCount="indefinite"/>
  </path>

  <!-- Animated technical path -->
  <path d="M65 285 C260 270 390 310 570 275 S850 260 1110 290"
        fill="none"
        stroke="#C77B9B"
        stroke-opacity=".3"
        stroke-width="1.3"
        stroke-dasharray="5 8">
    <animate attributeName="stroke-dashoffset"
             values="0;-52"
             dur="8s"
             repeatCount="indefinite"/>
  </path>

  <!-- Education -->
  <text x="68" y="326"
        fill="#E5B5C7"
        font-family="monospace"
        font-size="11"
        opacity=".8">
    IIIT GUWAHATI · M.TECH CSE (AI)
  </text>
</svg>

