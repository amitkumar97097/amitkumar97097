
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">

<title id="title">Amit Kumar | AI and Software Developer</title>
<desc id="desc">Cinematic burgundy developer banner with futuristic orbital graphics.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090509"/>
    <stop offset=".48" stop-color="#240B17"/>
    <stop offset="1" stop-color="#10070C"/>
  </linearGradient>

  <linearGradient id="rose" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D"/>
    <stop offset=".5" stop-color="#F0B8D0"/>
    <stop offset="1" stop-color="#701A3D"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <radialGradient id="light">
    <stop offset="0" stop-color="#C77B9B" stop-opacity=".3"/>
    <stop offset="1" stop-color="#701A3D" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#E5B5C7" stroke-opacity=".09" stroke-width=".7"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
</defs>

<!-- Background -->
<rect width="1200" height="390" rx="20" fill="url(#bg)"/>
<rect width="1200" height="390" rx="20" fill="url(#grid)"/>

<!-- Ambient lighting -->
<ellipse cx="930" cy="180" rx="300" ry="250" fill="url(#light)"/>

<!-- Top branding -->
<text x="65" y="48" fill="#C77B9B" font-family="monospace" font-size="12" letter-spacing="3">
  AMIT KUMAR / DEVELOPER PORTFOLIO
</text>

<text x="1135" y="48" fill="#E5B5C7" text-anchor="end" font-family="monospace" font-size="11">
  EST. 2026
</text>

<!-- Main identity -->
<text x="65" y="157" fill="#F8F0F3" font-family="Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2">
  AMIT KUMAR
</text>

<text x="69" y="205" fill="#E5B5C7" font-family="Arial, sans-serif" font-size="23" letter-spacing="2">
  SOFTWARE DEVELOPER
</text>

<text x="70" y="244" fill="#C77B9B" font-family="Arial, sans-serif" font-size="15" letter-spacing="1.5">
  FULL-STACK ENGINEERING  ×  ARTIFICIAL INTELLIGENCE
</text>

<!-- Glowing underline -->
<path d="M70 270H550" stroke="#451126" stroke-width="2"/>
<path d="M70 270H550" stroke="url(#rose)" stroke-width="3" stroke-linecap="round" stroke-dasharray="110 370">
  <animate attributeName="stroke-dashoffset" values="480;0" dur="5s" repeatCount="indefinite"/>
</path>

<!-- Right futuristic orbital artwork -->
<g transform="translate(930 178)">
  <circle r="132" fill="none" stroke="#701A3D" stroke-opacity=".25"/>
  <circle r="105" fill="none" stroke="#C77B9B" stroke-opacity=".5" stroke-dasharray="2 10">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="35s" repeatCount="indefinite"/>
  </circle>

  <ellipse rx="125" ry="55" fill="none" stroke="#C77B9B" stroke-opacity=".55" transform="rotate(-35)">
    <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="25s" repeatCount="indefinite"/>
  </ellipse>

  <ellipse rx="125" ry="55" fill="none" stroke="#701A3D" stroke-width="2" transform="rotate(55)"/>

  <circle r="66" fill="#451126" opacity=".45" filter="url(#glow)"/>
  <circle r="53" fill="#190B12" stroke="#C77B9B" stroke-opacity=".7" stroke-width="1.5"/>

  <text x="0" y="10" fill="#F8F0F3" font-family="monospace" font-size="37" text-anchor="middle" font-weight="bold">
    &lt;/&gt;
  </text>

  <circle cx="125" cy="-55" r="5" fill="#F0B8D0">
    <animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="-110" cy="72" r="4" fill="#C77B9B"/>
</g>

<!-- Floating code accents -->
<g fill="#E5B5C7" font-family="monospace" opacity=".55" font-size="13">
  <text x="760" y="85">{ AI }</text>
  <text x="1090" y="260">01</text>
  <text x="745" y="315">&lt;build /&gt;</text>
</g>

<!-- Bottom information strip -->
<path d="M65 330H1135" stroke="#701A3D" stroke-opacity=".65"/>

<g fill="#E5B5C7" font-family="monospace" font-size="11" letter-spacing="1.2">
  <text x="68" y="356">IIIT GUWAHATI</text>
  <text x="410" y="356">M.TECH CSE · AI</text>
  <text x="780" y="356">BUILDING INTELLIGENT PRODUCTS</text>
</g>

<circle cx="1125" cy="352" r="4" fill="#C77B9B">
  <animate attributeName="opacity" values=".3;1;.3" dur="2s" repeatCount="indefinite"/>
</circle>

</svg>
