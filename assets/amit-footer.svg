
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="footerTitle">

<title id="footerTitle">Thank you for visiting Amit Kumar's GitHub profile</title>

<defs>
  <linearGradient id="footerLine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#451126"/>
    <stop offset=".5" stop-color="#F0B8D0"/>
    <stop offset="1" stop-color="#451126"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>

  <radialGradient id="footerGlow">
    <stop offset="0" stop-color="#701A3D" stop-opacity=".25"/>
    <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="150" rx="15" fill="#10070C"/>

<ellipse cx="600" cy="65" rx="450" ry="90" fill="url(#footerGlow)"/>

<path d="M0 20 Q300 85 600 20 T1200 20"
      fill="none" stroke="#451126" stroke-width="1"/>

<path d="M0 30 Q300 95 600 30 T1200 30"
      fill="none" stroke="url(#footerLine)" stroke-width="2">
  <animate attributeName="stroke-dasharray"
           values="20 20;50 15;20 20"
           dur="5s" repeatCount="indefinite"/>
</path>

<text x="600" y="77"
      fill="#F8F0F3"
      text-anchor="middle"
      font-family="Arial, sans-serif"
      font-size="23"
      font-weight="bold"
      letter-spacing="4">
  KEEP BUILDING.
</text>

<text x="600" y="105"
      fill="#C77B9B"
      text-anchor="middle"
      font-family="monospace"
      font-size="11"
      letter-spacing="3">
  THANK YOU FOR VISITING MY PROFILE
</text>

<path d="M450 125H750" stroke="#701A3D" stroke-width="1"/>

<text x="600" y="141"
      fill="#E5B5C7"
      text-anchor="middle"
      font-family="monospace"
      font-size="9"
      letter-spacing="2">
  AMIT KUMAR · CODE WITH PURPOSE
</text>

</svg>
